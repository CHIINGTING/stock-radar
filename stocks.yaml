refresh_seconds: 3

strategy:
  buy_score: 80
  watch_score: 60

# TWSE MIS 即時報價連線設定（皆可省略，省略則用內建預設）
# 重要：force_http1 預設 true，因為 TWSE MIS 會 reset 掉 HTTP/2 連線
#       （以 cmd/twse-diag 矩陣 A–G 確認：h2 全 reset、h1 全成功）。
twse:
  force_http1: true        # 禁用 HTTP/2（解決 connection reset by peer）
  max_concurrent: 3        # 全域同時請求上限
  timeout_seconds: 10      # 每次請求逾時
  max_retries: 3           # reset/eof/timeout 才重試，300/700/1500ms + jitter
  disable_keepalive: false # reset 仍頻繁時可改 true（診斷 D 顯示也有幫助）

# Yahoo Finance 連線設定（歷史日線 + 盤中分鐘 K）。預設 HTTP/2（Yahoo 對 h2 正常）。
# 若你的網路對 Yahoo 也會 reset HTTP/2，把 force_http1 改成 true。
yahoo:
  force_http1: false       # 預設 false；網路對 Yahoo 也 reset h2 時改 true
  timeout_seconds: 10
  disable_keepalive: false

# 欄位說明：
#   market:     "TW" = 上市 / "TWO" = 上櫃 / 不填 = 自動偵測
#   warn:       "處置股" 或 "注意股"（不填 = 正常）
#   warn_start: YYYY-MM-DD（處置/注意開始日）
#   warn_end:   YYYY-MM-DD（預計解除日，用於倒數顯示）
#
# 範例（處置股）：
#   - code: "XXXX"
#     warn: "處置股"
#     warn_start: "2026-05-28"
#     warn_end: "2026-06-10"
